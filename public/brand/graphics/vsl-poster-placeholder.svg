<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="vslRadial" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0e0e13" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>
    <linearGradient id="vslBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#vslRadial)" />
  <rect x="20" y="20" width="1240" height="680" rx="16" stroke="url(#vslBorder)" stroke-width="1.5" />

  <!-- Abstract Geometric Grid Lines -->
  <line x1="20" y1="360" x2="1260" y2="360" stroke="#7928ca" stroke-opacity="0.1" stroke-dasharray="8 8" />
  <line x1="640" y1="20" x2="640" y2="700" stroke="#7928ca" stroke-opacity="0.1" stroke-dasharray="8 8" />

  <!-- Center Eye Silhouette -->
  <g transform="translate(640, 310) scale(1.5)">
    <path d="M-60 0C-40 -30 0 -45 60 0C40 30 0 45 -60 0Z" stroke="#9333ea" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="18" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5" />
  </g>

  <!-- Text Hierarchy -->
  <text x="640" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.3em" fill="#c084fc">
