<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="pupilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Aura -->
  <circle cx="60" cy="60" r="56" fill="url(#aura)" />

  <!-- Outer Geometric Sclera Contour -->
  <path d="M12 60C24 38 42 26 60 26C78 26 96 38 108 60C96 82 78 94 60 94C42 94 24 82 12 60Z" 
        stroke="url(#eyeGlow)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Iris Ring -->
  <circle cx="60" cy="60" r="22" 
          stroke="url(#eyeGlow)" 
          stroke-width="2.5" 
          stroke-dasharray="1 3" />

  <!-- Core Pupil & Cognitive Aperture -->
  <circle cx="60" cy="60" r="12" fill="url(#pupilGrad)" />
  <circle cx="60" cy="60" r="5" fill="#070709" />

  <!-- Perception Diamond Focus Marks -->
  <circle cx="60" cy="18" r="2" fill="#c084fc" />
  <circle cx="60" cy="102" r="2" fill="#c084fc" />
  <circle cx="4" cy="60" r="2" fill="#9333ea" />
  <circle cx="116" cy="60" r="2" fill="#9333ea" />
</svg>
