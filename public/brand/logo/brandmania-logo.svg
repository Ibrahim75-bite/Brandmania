<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Eye Symbol -->
  <g transform="translate(10, 10) scale(0.5)">
    <path d="M12 60C24 38 42 26 60 26C78 26 96 38 108 60C96 82 78 94 60 94C42 94 24 82 12 60Z" 
          stroke="url(#logoPurple)" 
          stroke-width="4" 
          stroke-linecap="round" />
    <circle cx="60" cy="60" r="20" stroke="url(#logoPurple)" stroke-width="3" stroke-dasharray="2 4" />
    <circle cx="60" cy="60" r="10" fill="url(#logoPurple)" />
    <circle cx="60" cy="60" r="4" fill="#070709" />
  </g>

  <!-- BRANDMANIA Wordmark -->
  <text x="85" y="48" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="0.18em" 
        fill="url(#textGrad)">
    BRANDMANIA
  </text>
  <text x="87" y="64" 
        font-family="-apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="0.32em" 
        fill="#9496a8">
    STRATEGIC BRAND ARCHITECTURE
  </text>
</svg>
